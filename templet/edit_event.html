<!DOCTYPE html>
<html>
<head>
    <title>Edit Event</title>
</head>
<body>

<h2>Edit Event</h2>

<form method="POST">

    <input type="text"
           name="event_name"
           value="{{ event.event_name }}"
           required><br><br>

    <input type="date"
           name="event_date"
           value="{{ event.event_date }}"
           required><br><br>

    <input type="text"
           name="venue"
           value="{{ event.venue }}"
           required><br><br>

    <input type="number"
           name="fee"
           value="{{ event.fee }}"
           required><br><br>

    <textarea name="description">{{ event.description }}</textarea><br><br>

    <button type="submit">
        Update Event
    </button>

</form>

<br>

<a href="{{ url_for('admin') }}">
    Back to Admin
</a>

</body>
</html>
