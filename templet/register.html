<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="registration-container">

    <h1>🎓 Student Registration</h1>

    <!-- EVENT DETAILS -->

    <div class="event-summary-box">

        <h2>{{ event.event_name }}</h2>

        <p>
            📅 <strong>Date:</strong>
            {{ event.event_date }}
        </p>

        <p>
            📍 <strong>Venue:</strong>
            {{ event.venue }}
        </p>

        <p>
            💰 <strong>Registration Fee:</strong>
            ₹{{ event.fee }}
        </p>

        <p>
            {{ event.description }}
        </p>

    </div>


    <!-- REGISTRATION FORM -->

    <form action="{{ url_for('register', event_id=event.event_id) }}"
          method="POST"
          enctype="multipart/form-data">


        <!-- HALL TICKET -->

        <div class="form-field">

            <label>Hall Ticket Number</label>

            <input
                type="text"
                name="hall_ticket"
                placeholder="Enter Hall Ticket Number"
                required>

        </div>


        <!-- STUDENT NAME -->

        <div class="form-field">

            <label>Student Name</label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter Student Name"
                required>

        </div>


        <!-- MOBILE -->

        <div class="form-field">

            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter Mobile Number"
                required>

        </div>


        <!-- EMAIL -->

        <div class="form-field">

            <label>Email Address</label>

            <input
                type="email"
                id="studentEmail"
                name="email"
                placeholder="Enter Gmail Address"
                required>

        </div>


        <!-- OTP -->

        <div class="form-field">

    <label>Email OTP</label>

    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            style="flex: 1; min-width: 220px;"
        >

        <button
            type="button"
            class="btn-primary"
            onclick="sendOTP()">
            Send OTP
        </button>

        <button
            type="button"
            class="btn-primary"
            onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

    <p id="otpMessage"
       style="margin-top: 8px; font-weight: 600;">
    </p>

</div>

            <p id="otpMessage"
               style="margin-top:8px; font-weight:600;">
            </p>

        </div>


        <!-- PAYMENT PROOF -->

        <div class="form-field">

            <label>Upload Payment Screenshot</label>

            <input
                type="file"
                name="payment_proof"
                accept="image/jpeg,image/png"
                required>

        </div>


        <!-- SELECTED EVENT -->

        <div class="form-field">

            <label>Selected Event</label>

            <input
                type="text"
                value="{{ event.event_name }}"
                readonly>

        </div>


        <!-- REGISTER -->

        <button
            type="submit"
            id="registerButton"
            class="btn-primary"
           >

            🚀 Register Now

        </button>

    </form>


    <br>

    <a href="{{ url_for('dashboard') }}">
        ← Back to Events
    </a>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
